<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>图标方案选择</title>
<style>
body { background: #1a1a2e; color: white; font-family: 'Microsoft YaHei', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 40px; margin: 0; }
h1 { font-size: 28px; margin-bottom: 30px; }
.grid { display: flex; gap: 30px; flex-wrap: wrap; justify-content: center; }
.card { background: rgba(255,255,255,0.08); border-radius: 16px; padding: 20px; text-align: center; width: 220px; border: 2px solid rgba(255,255,255,0.1); transition: border-color 0.3s; }
.card:hover { border-color: rgba(140,120,220,0.8); }
.card img { width: 180px; height: 180px; border-radius: 12px; margin-bottom: 12px; }
.card h3 { font-size: 18px; margin: 8px 0 4px; }
.card p { font-size: 13px; color: rgba(255,255,255,0.6); line-height: 1.5; }
.num { font-size: 40px; font-weight: bold; color: rgba(140,120,220,0.4); }
</style>
</head>
<body>
<h1>🎨 选择图标方案</h1>
<div class="grid">
  <div class="card">
    <div class="num">1</div>
    <img src="icon_option_1.png">
    <h3>银河星空球</h3>
    <p>深空底色 + 星云 + 200颗星星 + 细星环<br>和 App 银河主题一致</p>
  </div>
  <div class="card">
    <div class="num">2</div>
    <img src="icon_option_2.png">
    <h3>极简发光球</h3>
    <p>蓝紫渐变球体 + 发光环<br>现代扁平风格</p>
  </div>
  <div class="card">
    <div class="num">3</div>
    <img src="icon_option_3.png">
    <h3>暖色土星</h3>
    <p>紫棕色调球体 + 厚实土星环<br>温暖质感</p>
  </div>
  <div class="card">
    <div class="num">4</div>
    <img src="icon_option_4.png">
    <h3>黑洞吸积盘</h3>
    <p>纯黑球体 + 橙蓝渐变光环<br>科幻风格</p>
  </div>
</div>
</body>
</html>
